# Validate that PR titles are prefixed with one of our accepted labels
name: "PR Title Checker"
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - auto_merge_enabled

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title validity
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$TITLE"
          count=$(grep -o -E '\[(FEATURE|BUGFIX|DOCS|MAINTENANCE|RELEASE|CONTRIB|MINORBUMP|MAJORBUMP)\]' <<<"$title" | wc -l)
          if [ "$count" -ne 1 ] || ! grep -q -E '^\[(FEATURE|BUGFIX|DOCS|MAINTENANCE|RELEASE)\] ' <<<"$title"; then
            echo "PR titles start with exactly one of [FEATURE] (advances a user-facing capability or public API, whether or not that capability is reachable yet), [BUGFIX] (corrects behavior that diverges from documented or intended behavior), [DOCS] (changes documentation only), or [MAINTENANCE] (has no user-facing goal: dependencies, CI, tooling, typing, behavior-preserving refactors, tests). [CONTRIB] and [MINORBUMP] are retired and no longer accepted."
            exit 1
          fi
