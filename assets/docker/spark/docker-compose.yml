services:
  spark-connect:
    image: ${ECR_PULL_THROUGH_REPOSITORY_URL}apache/spark:3.5.7-scala
    ports:
      - "15002:15002" # Spark Connect port
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER=local[*]
    command: /opt/spark/sbin/start-connect-server.sh --master local[*]
